; 插件清单：宿主扫描本文件后拉起 exe 并注册 /p/dash/ 路由。
; group = 侧栏菜单分组，用 / 表示多层级：group=A/B/C -> 三级菜单
;         group=-  -> 该插件直接作为顶层菜单行（不套分组）
; icon  = 侧栏菜单图标（16x16 bmp/png），相对本清单目录
; roles = 允许访问的角色，逗号分隔。不写 = 所有已登录用户；
;         admin 角色通配全部插件（清单里不必重复列 admin）
;         演示：admin 全部、analyst 仪表盘+便签、guest 只有便签
roles=admin,analyst
name=dash
title=仪表盘
group=业务管理
icon=..\icons\dash.bmp
exe=dashplug.exe
port=8881
