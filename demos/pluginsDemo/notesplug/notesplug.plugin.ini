; 插件清单：宿主扫描本文件后拉起 exe 并注册 /p/notes/ 路由。
; 这里刻意写两级分组（系统管理 / 数据维护），加上顶层分组就是三级菜单：
;   系统管理 ▾
;     数据维护 ▾
;       便签
; 本清单刻意不写 roles= ：表示所有已登录用户都能打开（含 guest）。
; 另有 roles=admin / roles=admin,analyst 的插件做对比，见 dashplug、reportsplug
name=notes
title=便签
group=系统管理/数据维护
icon=..\icons\notes.bmp
exe=notesplug.exe
port=8882
