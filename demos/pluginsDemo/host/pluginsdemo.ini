; pluginsDemo 宿主（主程序 exe）
; 同名 ini 自动加载，命令行参数优先级更高。

client=alpine
port=8878
theme=auto

; TLS：浏览器 <-> 宿主之间的登录凭据（用户/口令/验证码）全程加密。
; 相对路径按本 exe 目录展开，证书 SAN 含 localhost 与 127.0.0.1。
; 开启后 WebSocket 自动从 ws:// 切到 wss://。
ssl=1
sslcert=..\..\..\cert-ca\server-chain.pem
sslkey=..\..\..\cert-ca\server.key

; 插件不在这里逐个登记：宿主启动时扫描 ../<插件目录>/*.plugin.ini，
; 按清单注册 /p/<名>/ 路由并拉起插件 exe。
; 插件运行副本放在 ../.run/，所以原始 exe 可以被重新编译（热更新）。
